# pyproject.toml
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dantesito_quipucamayoc"  # 🚀 IDENTITY UPGRADE: Sincronizado con el pending publisher de PyPI
version = "1.5.0"                # Se actualizará dinámicamente en el contenedor de GitHub según el Tag
description = "Librería de procesamiento y RAG de documentos legales optimizada para bajo consumo de RAM."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Dantesito", email = "developer@dantesito.local" }
]
dependencies = [
    "docling>=2.0.0",
    "tiktoken>=0.7.0",
    "chromadb>=0.5.0",
    "ijson>=3.3.0",
    "requests>=2.32.0",
    "streamlit>=1.30.0",
    "google-genai>=0.1.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "google-api-python-client>=2.118.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "anyio>=4.0.0",
    "faker>=20.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dantesito*"]
namespaces = true
