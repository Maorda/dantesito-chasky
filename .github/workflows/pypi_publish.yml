name: 🚀 Publicar Librería en PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    name: 🧪 1. Control de Calidad (Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: ⚙️ Descargar código del repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar entorno Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: ⚙️ Instalar dependencias del proyecto (Core + Dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install anyio faker

      - name: 🧪 Ejecutar suite de pruebas perimetrales
        env:
          NESTJS_API_URL: "https://koyeb.app"
          GOOGLE_DRIVE_FOLDER_ID: "1lsNX5GEiM7-Ho2kTbu00AqfckAnyWyFl"
          GEMINI_API_KEY: "AIzaSyMockKey_Pipeline_777"
          GOOGLE_CLIENT_EMAIL: "uploadsad@://gserviceaccount.com"
          GOOGLE_PRIVATE_KEY: "-----BEGIN RSA PRIVATE KEY-----\nMOCK\n-----END RSA PRIVATE KEY-----\n"
          QUIPU_API_AUTH_TOKEN: "Messenger2"
        run: |
          pytest tests/ -v

  publish:
    name: 📦 2. Empaquetar y Publicar en PyPI
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Requerido para Trusted Publisher OIDC federado
      contents: read
    steps:
      - name: ⚙️ Descargar código del repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar entorno Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ⚙️ Sincronizar versión dinámicamente desde el Tag de Git
        run: |
          VERSION_TAG=${GITHUB_REF#refs/tags/v}
          echo "Sincronizando metadatos del empaquetado con la versión: $VERSION_TAG"
          sed -i "s/version = .*/version = \"$VERSION_TAG\"/g" pyproject.toml

      - name: ⚙️ Instalar herramientas de empaquetado (Build)
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: 📦 Construir binarios de distribución (.whl y tar.gz)
        run: python -m build

      - name: 🚀 Publicar legajo en PyPI vía Trusted Publisher oficial
        uses: pypa/gh-action-pypi-publish@release # 🚀 NOMBRE CORRECTO: El componente legítimo del Marketplace
